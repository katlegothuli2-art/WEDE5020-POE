    <h1 style="text-align:center; color:white; margin-top: 30px;">CART</h1>

    <div id="cart-box">
        <div id="cart-items"></div>
        <hr>
        <h2 id="total">Total: R0</h2>
    </div>
    <div style="text-align:center;">
        <button class="black" onclick="clearCart()">Clear Cart</button>
        <a href="products.html"><button>Continue Shopping</button></a>
    
    </div>
    
    <script>
    let cart = JSON.parse(localStorage.getItem('ashariCart')) || [];
    let itemsDiv = document.getElementById('cart-items');
    let total=0;
    document.getElementById('cart-count').textContent = cart.length;

    if (cart.length === 0) {
        itemsDiv.innerHTML = "<p>Your cart is empty.</p>";
    }else {
        cart.forEach(item => {
            let itemDiv = document.createElement('div');
            itemDiv.textContent = item.name + " - R" + item.price;
            itemsDiv.appendChild(itemDiv);
            total += item.price;
            itemsDiv.innerHTML += "<p><b>Total: R" + total + "</b></p>";
        });
    }
    document.getElementById('total').textContent = "Total: R" + total;
    function clearCart() {
        localStorage.removeItem('ashariCart');
        location.reload(); }
        function removeItem(i){
            cart.splice(i, 1);
            localStorage.setItem('ashariCart', JSON.stringify(cart));
            location.reload();
        }
        </script>
